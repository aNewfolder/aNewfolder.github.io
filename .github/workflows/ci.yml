name: ci                            # 工作流名称

on:                                 # 触发条件
  push:                             # 有代码推送时触发
    branches:
      - main                        # 只在 main 分支触发

permissions:                        # 权限配置
  contents: write                   # 允许写入（部署到 gh-pages 分支需要）

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4               # 拉取代码
        with:
          fetch-depth: 0                        # 拉取完整 git 历史（页面创建/更新日期插件需要）

      - uses: actions/setup-python@v5           # 安装 Python
        with:
          python-version: 3.x

      - run: pip install -r requirements.txt   # 安装锁定版本依赖（见 requirements.txt，含页面日期插件）

      - run: mkdocs gh-deploy --force --strict  # 严格模式构建并部署到 gh-pages 分支（警告即失败）
